<svg xmlns="http://www.w3.org/2000/svg" width="800" height="120" viewBox="0 0 800 120">
  <defs>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="20%" style="stop-color:#58a6ff;stop-opacity:0.9" />
      <stop offset="50%" style="stop-color:#79c0ff;stop-opacity:1" />
      <stop offset="80%" style="stop-color:#58a6ff;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#0d1117;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="dotFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#58a6ff;stop-opacity:0.15" />
    </linearGradient>
  </defs>
  <rect x="0" y="56" width="800" height="2" fill="url(#lineGrad)" rx="1">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite" />
  </rect>
  <rect x="0" y="56" width="120" height="2" fill="#79c0ff" opacity="0.8" rx="1">
    <animate attributeName="x" from="0" to="680" dur="4s" repeatCount="indefinite" />
  </rect>
  <g fill="url(#dotFill)">
    <circle cx="80" cy="30" r="2"><animate attributeName="opacity" values="0.2;0.7;0.2" dur="2s" repeatCount="indefinite" /></circle>
    <circle cx="200" cy="25" r="1.5"><animate attributeName="opacity" values="0.3;0.8;0.3" dur="2.5s" repeatCount="indefinite" begin="0.3s" /></circle>
    <circle cx="320" cy="35" r="2"><animate attributeName="opacity" values="0.2;0.6;0.2" dur="2.2s" repeatCount="indefinite" begin="0.6s" /></circle>
    <circle cx="440" cy="28" r="1.5"><animate attributeName="opacity" values="0.25;0.75;0.25" dur="2.8s" repeatCount="indefinite" begin="0.2s" /></circle>
    <circle cx="560" cy="32" r="2"><animate attributeName="opacity" values="0.2;0.7;0.2" dur="2.4s" repeatCount="indefinite" begin="0.5s" /></circle>
    <circle cx="680" cy="26" r="1.5"><animate attributeName="opacity" values="0.3;0.8;0.3" dur="2.6s" repeatCount="indefinite" begin="0.1s" /></circle>
    <circle cx="720" cy="90" r="2"><animate attributeName="opacity" values="0.2;0.6;0.2" dur="2.3s" repeatCount="indefinite" begin="0.4s" /></circle>
    <circle cx="100" cy="85" r="1.5"><animate attributeName="opacity" values="0.25;0.7;0.25" dur="2.7s" repeatCount="indefinite" begin="0.7s" /></circle>
  </g>
