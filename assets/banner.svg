<svg xmlns="http://www.w3.org/2000/svg" width="800" height="140" viewBox="0 0 800 140">
  <defs>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#79c0ff;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#58a6ff;stop-opacity:0"/>
    </linearGradient>
  </defs>
  <g fill="#f0f6fc" font-family="sans-serif" font-size="24" font-weight="500" text-anchor="middle">
    <text x="400" y="56">
      Technical Lead · Systems Architect · Full-Stack Engineer
      <animate attributeName="opacity" values="0.94;1;0.94" dur="3.5s" repeatCount="indefinite"/>
    </text>
  </g>
  <line x1="200" y1="70" x2="600" y2="70" stroke="url(#line)" stroke-width="1" opacity="0.9">
    <animate attributeName="opacity" values="0.5;0.95;0.5" dur="2.8s" repeatCount="indefinite" begin="0.5s"/>
  </line>
  <rect x="0" y="69" width="80" height="1" fill="#79c0ff" opacity="0.6">
    <animate attributeName="x" from="200" to="520" dur="5s" repeatCount="indefinite"/>
  </rect>
  <text x="400" y="98" fill="#8b949e" font-family="sans-serif" font-size="14" font-weight="400" text-anchor="middle">
    React · Next.js · System Design · Automation · Scalable Architectures
    <animate attributeName="opacity" values="0.85;1;0.85" dur="3.2s" repeatCount="indefinite" begin="0.3s"/>
  </text>
</svg>
