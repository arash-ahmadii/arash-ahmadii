<svg xmlns="http://www.w3.org/2000/svg" width="820" height="160" viewBox="0 0 820 160">
  <defs>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff"/>
      <stop offset="100%" style="stop-color:#79c0ff"/>
    </linearGradient>
  </defs>
  <text x="410" y="52" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="22" font-weight="600" fill="#e6edf3">
    Technical Lead · Systems Architect · Full-Stack Engineer
  </text>
  <path id="underline" d="M 180 62 L 640 62" stroke="url(#accent)" stroke-width="2" stroke-linecap="round" fill="none" stroke-dasharray="460" stroke-dashoffset="460">
    <animate attributeName="stroke-dashoffset" from="460" to="0" dur="1.2s" fill="freeze"/>
    <animate attributeName="opacity" values="1;0.4;1" dur="2.5s" repeatCount="indefinite" begin="1.5s"/>
  </path>
  <rect x="0" y="78" width="120" height="1.5" fill="#58a6ff" opacity="0.6" rx="1">
    <animate attributeName="x" from="0" to="700" dur="4s" repeatCount="indefinite"/>
  </rect>
  <text x="410" y="100" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="400" fill="#8b949e">
    React · Next.js · System Design · Automation · Scalable Architectures
  </text>
  <g fill="#58a6ff">
    <circle cx="268" cy="48" r="1.5">
      <animate attributeName="opacity" values="0.25;0.9;0.25" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="552" cy="48" r="1.5">
      <animate attributeName="opacity" values="0.25;0.9;0.25" dur="2.2s" repeatCount="indefinite" begin="0.5s"/>
    </circle>
  </g>
</svg>
